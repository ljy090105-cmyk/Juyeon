<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>약 보관 도우미</title>

<style>
body{
    font-family: Arial, sans-serif;
    background-color:#f4f6f8;
    margin:0;
    padding:30px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#333;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input, select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.result{
    margin-top:25px;
    padding:20px;
    background:#eef6ff;
    border-radius:10px;
}

ul{
    padding-left:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>약 보관 도우미</h1>

<label>약 이름</label>
<input type="text" id="medicine" placeholder="예: 타이레놀">

<label>보관 장소</label>
<select id="place">
    <option value="medicinebox">약 보관함</option>
    <option value="drawer">서랍</option>
    <option value="desk">책상 위</option>
    <option value="bag">가방 안</option>
    <option value="fridge">냉장고</option>
    <option value="kitchen">주방</option>
    <option value="bathroom">화장실</option>
    <option value="car">차량 내부</option>
</select>

<label>현재 온도 (℃)</label>
<input type="number" id="temp" placeholder="예: 25">

<button onclick="checkMedicine()">진단하기</button>

<div id="result" class="result">
    진단 결과가 여기에 표시됩니다.
</div>

</div>

<script>

function checkMedicine(){

    let medicine = document.getElementById("medicine").value;
    let place = document.getElementById("place").value;
    let temp = Number(document.getElementById("temp").value);

    if(medicine.trim() === ""){
        alert("약 이름을 입력해주세요.");
        return;
    }

    if(document.getElementById("temp").value === ""){
        alert("온도를 입력해주세요.");
        return;
    }

    let score = 100;

    if(place === "medicinebox") score -= 0;
    if(place === "drawer") score -= 5;
    if(place === "desk") score -= 10;
    if(place === "bag") score -= 15;
    if(place === "fridge") score -= 10;
    if(place === "kitchen") score -= 20;
    if(place === "bathroom") score -= 25;
    if(place === "car") score -= 40;

    if(temp > 30) score -= 30;
    if(temp < 1) score -= 20;

    if(score < 0){
        score = 0;
    }

    let resultText = "";

    if(score >= 80){
        resultText = "✅ 적절한 보관 환경입니다.";
    }
    else if(score >= 50){
        resultText = "⚠ 보관 환경을 점검해 보세요.";
    }
    else{
        resultText = "🚨 약품 품질 저하 위험이 있습니다.";
    }

    let advice = "";

    switch(place){

        case "medicinebox":
            advice =
            "<li>현재 보관 장소가 적절합니다.</li>" +
            "<li>직사광선을 피하세요.</li>" +
            "<li>정기적으로 유효기간을 확인하세요.</li>";
            break;

        case "drawer":
            advice =
            "<li>서늘하고 건조한 서랍을 사용하세요.</li>" +
            "<li>열기구 근처는 피하세요.</li>" +
            "<li>직사광선을 피하세요.</li>";
            break;

        case "desk":
            advice =
            "<li>햇빛이 직접 닿지 않도록 하세요.</li>" +
            "<li>창가 보관은 피하는 것이 좋습니다.</li>" +
            "<li>고온 환경에 주의하세요.</li>";
            break;

        case "bag":
            advice =
            "<li>장시간 차량 안에 두지 마세요.</li>" +
            "<li>여름철 고온에 주의하세요.</li>" +
            "<li>충격을 받지 않도록 보관하세요.</li>";
            break;

        case "fridge":
            advice =
            "<li>냉장 보관이 필요한 약인지 먼저 확인하세요.</li>" +
            "<li>냉동실에는 보관하지 마세요.</li>" +
            "<li>습기가 차지 않도록 주의하세요.</li>";
            break;

        case "kitchen":
            advice =
            "<li>조리 중 발생하는 열을 피하세요.</li>" +
            "<li>싱크대 주변의 습기에 주의하세요.</li>" +
            "<li>다른 장소로 옮기는 것을 권장합니다.</li>";
            break;

        case "bathroom":
            advice =
            "<li>화장실은 습도가 높아 보관에 적합하지 않습니다.</li>" +
            "<li>건조한 장소로 옮기는 것을 권장합니다.</li>" +
            "<li>약 보관함이나 서랍 사용을 추천합니다.</li>";
            break;

        case "car":
            advice =
            "<li>차량 내부는 매우 높은 온도에 노출될 수 있습니다.</li>" +
            "<li>장시간 차량 보관은 피하세요.</li>" +
            "<li>실내의 서늘한 장소로 옮기세요.</li>";
            break;
    }

    document.getElementById("result").innerHTML =

    "<h2>진단 결과</h2>" +

    "<p><b>약 이름:</b> " + medicine + "</p>" +

    "<p><b>안전도:</b> " + score + "점</p>" +

    "<p><b>평가:</b> " + resultText + "</p>" +

    "<hr>" +

    "<h3>📌 맞춤 권장 사항</h3>" +

    "<ul>" + advice + "</ul>";
}
</script>

</body>
</html>
