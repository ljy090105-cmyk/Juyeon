<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>약 보관 도우미</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:30px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input, select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    margin-top:20px;
    padding:12px;
    font-size:16px;
    cursor:pointer;
}

.result{
    margin-top:20px;
    padding:15px;
    background:#eef6ff;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>약 보관 도우미</h1>

<label>약 이름</label>
<input type="text" id="medicine" placeholder="예: 타이레놀">

<label>보관 장소</label>
<select id="place">
    <option value="drawer">서랍</option>
    <option value="fridge">냉장고</option>
    <option value="bathroom">화장실</option>
    <option value="car">차량 내부</option>
</select>

<label>현재 온도 (℃)</label>
<input type="number" id="temp" placeholder="예: 25">

<button onclick="checkMedicine()">진단하기</button>

<div id="result" class="result"></div>

</div>

<script>

function checkMedicine(){

    let medicine = document.getElementById("medicine").value;
    let place = document.getElementById("place").value;
    let temp = Number(document.getElementById("temp").value);

    let score = 100;

    if(place === "bathroom") score -= 20;
    if(place === "car") score -= 40;

    if(temp > 30) score -= 30;
    if(temp < 1) score -= 20;

    let resultText = "";

    if(score >= 80){
        resultText = "✅ 적절한 보관 환경입니다.";
    }
    else if(score >= 50){
        resultText = "⚠ 보관 환경을 확인해 보세요.";
    }
    else{
        resultText = "🚨 약품 품질 저하 위험이 있습니다.";
    }

    document.getElementById("result").innerHTML =
    "<h2>진단 결과</h2>" +
    "<p><b>약 이름:</b> " + medicine + "</p>" +
    "<p><b>안전도:</b> " + score + "점</p>" +
    "<p><b>평가:</b> " + resultText + "</p>" +
    "<hr>" +
    "<h3>권장 사항</h3>" +
    "<ul>" +
    "<li>직사광선을 피하세요.</li>" +
    "<li>제품 설명서의 보관 방법을 확인하세요.</li>" +
    "<li>고온의 차량 내부 보관은 피하세요.</li>" +
    "<li>습기가 많은 화장실 보관은 피하는 것이 좋습니다.</li>" +
    "</ul>";
}

</script>

</body>
</html>
